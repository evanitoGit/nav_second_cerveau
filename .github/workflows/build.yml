# Construit et teste les installateurs Windows et Linux à chaque push.
# - Branche / PR : installateurs disponibles dans les « Artifacts » du run.
# - Publication d'une version (tag vX.Y.Z poussé, ou bouton « Run workflow » avec « Publier ») :
#   brouillon de Release → installateurs déposés par chaque plateforme → Release publiée
#   uniquement si les deux builds ET leurs autotests ont réussi. Les navigateurs installés
#   se mettent alors à jour automatiquement.
name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier une Release (version de package.json)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.publish || false }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        name: Mode de publication
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
              echo "::error::Le tag ${GITHUB_REF#refs/tags/} ne correspond pas à la version $VERSION de package.json"
              exit 1
            fi
            PUBLISH=true
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION — publication : $PUBLISH"
      - name: Brouillon de Release
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [[ "$(gh release view "v$VERSION" --json isDraft -q .isDraft)" != "true" ]]; then
              echo "::error::La version v$VERSION est déjà publiée : augmentez la version dans package.json."
              exit 1
            fi
          else
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
              --title "Second Cerveau $VERSION" --notes-file .github/release-notes.md
          fi

  package:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            # 22.04 : glibc plus ancienne, donc paquets compatibles avec plus de distributions.
            os: ubuntu-22.04
            target: linux
          - name: Windows
            os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build

      - name: Installateurs
        run: npx electron-builder --${{ matrix.target }} --x64 --publish never

      # Lance le navigateur packagé en mode autotest : base, sqlite-vec, WebP, vrai modèle d'IA,
      # recherche. Garantit que le binaire FONCTIONNE sur chaque système, pas seulement qu'il compile.
      - name: Cache du modèle d'IA
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: embedding-model-multilingual-e5-small-v1

      - name: Autotest (Linux)
        if: matrix.target == 'linux'
        env:
          SECOND_CERVEAU_MODELS_DIR: ${{ runner.temp }}/models
        run: |
          xvfb-run -a release/linux-unpacked/second-cerveau --self-test --self-test-report=self-test.json || STATUS=$?
          cat self-test.json || true
          exit ${STATUS:-0}

      - name: Autotest (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        env:
          SECOND_CERVEAU_MODELS_DIR: ${{ runner.temp }}/models
        run: |
          $exe = Get-ChildItem release/win-unpacked/*.exe | Where-Object { $_.Name -notlike '*Uninstall*' } | Select-Object -First 1
          Write-Host "Exécutable : $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test', "--self-test-report=$PWD\\self-test.json" -Wait -PassThru
          Get-Content self-test.json -ErrorAction SilentlyContinue
          exit $p.ExitCode

      # Déposé dans le brouillon seulement après un autotest réussi.
      - name: Dépôt dans la Release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          FILES=(release/*.exe release/*.exe.blockmap release/*.deb release/*.AppImage release/latest*.yml)
          printf '%s\n' "${FILES[@]}"
          gh release upload "v$VERSION" "${FILES[@]}" --clobber

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: second-cerveau-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publication
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
